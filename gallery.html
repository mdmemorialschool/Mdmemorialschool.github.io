<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Gallery | M.D Memorial School</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f8f5ee;
    color:#172033;
}

/* SCHOOL HEADER */
.top-header{
    background:#071936;
    color:white;
    min-height:95px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px 20px;
    border-bottom:4px solid #e5b85c;
}

.school-header{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:65px;
    height:65px;
    object-fit:contain;
    border-radius:50%;
    background:white;
}

.school-name{
    font-size:26px;
    font-weight:800;
}

.school-location{
    font-size:14px;
    color:#f5d98b;
    margin-top:5px;
}

/* MAIN */
.container{
    max-width:1100px;
    margin:45px auto;
    padding:0 20px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.page-title h1{
    color:#071936;
    font-size:34px;
    margin-bottom:10px;
}

.line{
    width:70px;
    height:4px;
    background:#e5b85c;
    margin:auto;
    border-radius:10px;
}

.page-title p{
    color:#6d7687;
    margin-top:12px;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.gallery-item{
    background:white;
    padding:8px;
    border-radius:16px;
    box-shadow:0 12px 35px rgba(7,25,54,.12);
    border:1px solid #e7eaf0;
    overflow:hidden;
}

.gallery-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    border-radius:11px;
    transition:transform .3s ease;
}

.gallery-item:hover img{
    transform:scale(1.03);
}

/* FOOTER */
.footer{
    margin-top:50px;
    background:#071936;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-top:4px solid #e5b85c;
}

.footer p{
    font-size:13px;
    color:#dce3ef;
    line-height:1.7;
}

/* MOBILE */
@media(max-width:750px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .gallery-item img{
        height:200px;
    }

    .school-name{
        font-size:20px;
    }

    .school-location{
        font-size:11px;
    }

}

@media(max-width:500px){

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery-item img{
        height:260px;
    }

    .container{
        padding:0 12px;
    }

}
</style>
</head>

<body>

<!-- SCHOOL HEADER -->
<header class="top-header">

    <div class="school-header">

        <img src="logo.jpeg"
             alt="M.D Memorial School Logo"
             class="logo">

        <div>

            <div class="school-name">
                M.D Memorial School
            </div>

            <div class="school-location">
                Aurangabad, Bulandshahr, Uttar Pradesh
            </div>

        </div>

    </div>

</header>


<!-- SCHOOL GALLERY -->
<main class="container">

    <div class="page-title">

        <h1>School Gallery</h1>

        <div class="line"></div>

        <p>Moments from M.D Memorial School</p>

    </div>


    <div class="gallery">

        <div class="gallery-item">
            <img src="a5b00ca8-6e49-4309-b53b-1b7a1586dd9e.jpeg"
                 alt="M.D Memorial School">
        </div>

        <div class="gallery-item">

                 alt="M.D Memorial School">
        </div>

        <div class="gallery-item">
            <img src="1e7a30a4-c8b3-4405-9297-bbceee85123e.jpeg"
                 alt="M.D Memorial School">
        </div>

        <div class="gallery-item">
            <img src="1f491bd3-0e0c-4568-b970-43b2985cdb1e.jpeg"
                 alt="M.D Memorial School">
        </div>

        <div class="gallery-item">
            <img src="2EADB222-24B2-4D4F-A2B3-64A13E3DFEBB.png"
                 alt="M.D Memorial School">
        </div>

        <div class="gallery-item">
            <img src="788853e2-ff2a-417d-ab30-7d62065f4b50.jpeg"

        <div class="gallery-item">

                 alt="M.D Memorial School">
        </div>

    </div>

</main>


<!-- FOOTER -->
<footer class="footer">

    <p>
        © 2026 M.D Memorial School, Aurangabad, Bulandshahr
    </p>

    <p>
        LEARN • GROW • SHINE
    </p>

</footer>

</body>
</html>
