<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:description" content="M.D Memorial School — Learn • Grow • Shine. English medium education from Nursery to Class 5.">

<meta property="og:site_name" content="M.D Memorial School">
<meta property="og:locale" content="en_IN">

<meta name="theme-color" content="#071936">

<style>

:root{
  --navy:#071936;
  --navy2:#0b2348;
  --blue:#123d7a;
  --gold:#e5b85c;
  --gold2:#f5d98b;
  --cream:#f8f5ee;
  --white:#ffffff;
  --text:#172033;
  --muted:#6d7687;
  --line:#e7eaf0;
  --soft:#f5f7fa;
  --shadow:0 20px 60px rgba(7,25,54,.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
  overflow-x:hidden;
}

img{
  max-width:100%;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  background:var(--navy);
  color:#fff;
  padding:9px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.topbar span{
  opacity:.92;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(7,25,54,.08);
}

.nav-inner{
  max-width:1400px;
  margin:auto;
  padding:12px 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
  border-radius:50%;
}

.brand-text strong{
  display:block;
  color:var(--navy);
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.2;
}

.brand-text small{
  color:#7b8493;
  font-size:11px;
  letter-spacing:1.5px;
}


/* DESKTOP NAVIGATION */

.desktop-nav{
  display:flex;
  align-items:center;
  gap:27px;
}

.desktop-nav a{
  position:relative;
  color:var(--navy);
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  padding:12px 0;
  transition:.25s;
}

.desktop-nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:4px;
  width:0;
  height:2px;
  background:var(--gold);
  transition:.25s;
}

.desktop-nav a:hover{
  color:#a77b20;
}

.desktop-nav a:hover::after{
  width:100%;
}

.desktop-admission{
  background:var(--gold);
  color:var(--navy)!important;
  padding:13px 19px!important;
  border-radius:7px;
}

.desktop-admission::after{
  display:none;
}

.desktop-admission:hover{
  background:#f0ca72;
  transform:translateY(-2px);
}


/* MOBILE MENU BUTTON */

.menu-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:13px;
  background:var(--navy);
  color:#fff;
  font-size:25px;
  cursor:pointer;
  display:none;
  place-items:center;
  transition:.3s;
}

.menu-btn:hover{
  background:var(--blue);
}


/* MOBILE DROPDOWN */

.menu-panel{
  position:absolute;
  top:100%;
  right:5%;
  width:280px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  box-shadow:0 20px 50px rgba(7,25,54,.20);
  display:none;
  animation:menuOpen .25s ease;
}

.menu-panel.show{
  display:block;
}

@keyframes menuOpen{
  from{
    opacity:0;
    transform:translateY(-10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.menu-panel a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  border-radius:12px;
  color:var(--navy);
  font-weight:600;
  font-size:14px;
  transition:.2s;
}

.menu-panel a:hover{
  background:var(--cream);
  color:var(--blue);
}

.menu-panel .menu-admission{
  background:var(--navy);
  color:#fff;
  margin-top:5px;
}

.menu-panel .menu-admission:hover{
  background:var(--blue);
  color:#fff;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  min-height:calc(100vh - 100px);
  min-height:720px;
  position:relative;
  overflow:hidden;
  color:#fff;

  background-image:
    linear-gradient(
      90deg,
      rgba(4,17,38,.86) 0%,
      rgba(4,17,38,.68) 35%,
      rgba(4,17,38,.28) 70%,
      rgba(4,17,38,.12) 100%
    ),
    url("4794420C-2C8C-4713-BF55-E23285559A30.jpeg");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}


/* DARK BOTTOM GRADIENT */

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      transparent 55%,
      rgba(2,10,24,.45) 100%
    );
  pointer-events:none;
}


/* HERO CONTENT */

.hero-inner{
  position:relative;
  z-index:2;
  max-width:1400px;
  min-height:720px;
  margin:auto;
  padding:80px 5% 90px;
  display:flex;
  align-items:center;
}

.hero-content{
  max-width:690px;
}

.hero-tag{
  display:inline-flex;
  align-items:center;
  gap:13px;
  color:var(--gold2);
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:22px;
}

.hero-tag::before,
.hero-tag::after{
  content:"";
  width:42px;
  height:1px;
  background:var(--gold);
}


.hero h1{
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  font-size:clamp(48px,6vw,78px);
  line-height:1.02;
  letter-spacing:-2px;
  margin-bottom:22px;
  text-transform:uppercase;
}

.hero h1 span{
  color:var(--gold);
}

.hero-sub{
  font-size:18px;
  line-height:1.7;
  max-width:650px;
  color:rgba(255,255,255,.88);
  margin-bottom:32px;
}


/* HERO BUTTONS */

.hero-buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:15px 27px;
  border-radius:6px;
  font-weight:700;
  transition:.3s;
  min-width:175px;
}

.btn-gold{
  background:var(--gold);
  color:var(--navy);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.btn-gold:hover{
  background:#f0ca72;
  transform:translateY(-3px);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.65);
  color:#fff;
  background:rgba(255,255,255,.04);
}

.btn-outline:hover{
  background:#fff;
  color:var(--navy);
  transform:translateY(-3px);
}


/* HERO FEATURES */

.hero-features{
  display:flex;
  margin-top:55px;
  max-width:700px;
}

.hero-feature{
  flex:1;
  padding:0 25px;
  border-right:1px solid rgba(255,255,255,.35);
}

.hero-feature:first-child{
  padding-left:0;
}

.hero-feature:last-child{
  border-right:0;
}

.hero-feature-icon{
  font-size:28px;
  margin-bottom:7px;
}

.hero-feature strong{
  display:block;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.hero-feature span{
  display:block;
  font-size:11px;
  color:rgba(255,255,255,.7);
  margin-top:3px;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  position:relative;
  margin:-55px auto 0;
  max-width:1050px;
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:28px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:5;
}

.stat{
  text-align:center;
  padding:8px 15px;
  border-right:1px solid var(--line);
}

.stat:last-child{
  border-right:0;
}

.stat strong{
  display:block;
  font-family:Georgia,serif;
  color:var(--navy);
  font-size:27px;
}

.stat span{
  color:var(--muted);
  font-size:13px;
}


/* =====================================================
   GENERAL
===================================================== */

section{
  padding:95px 5%;
}

.container{
  max-width:1150px;
  margin:auto;
}

.section-head{
  text-align:center;
  max-width:700px;
  margin:0 auto 50px;
}

.eyebrow{
  color:#a77b20;
  letter-spacing:2px;
  font-size:12px;
  font-weight:800;
}

.section-head h2{
  font-family:Georgia,serif;
  font-size:clamp(34px,4vw,48px);
  color:var(--navy);
  margin:9px 0 12px;
}

.section-head p{
  color:var(--muted);
}


/* PAGE SYSTEM */

.page-section{
  display:none;
}

.page-section.active{
  display:block;
  animation:pageOpen .35s ease;
}

@keyframes pageOpen{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.home-section{
  display:block;
}


/* =====================================================
   ABOUT
===================================================== */

.about{
  background:var(--cream);
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center;
}

.about-text h3{
  font-family:Georgia,serif;
  font-size:35px;
  color:var(--navy);
  margin-bottom:18px;
}

.about-text p{
  color:var(--muted);
  margin-bottom:18px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.feature{
  background:#fff;
  padding:22px;
  border-radius:18px;
  border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(7,25,54,.05);
}

.feature strong{
  display:block;
  color:var(--navy);
  margin-bottom:5px;
}

.feature span{
  color:var(--muted);
  font-size:13px;
}

.message{
  background:var(--navy);
  color:#fff;
  padding:38px;
  border-radius:28px;
  margin-top:25px;
  position:relative;
  overflow:hidden;
}

.message::after{
  content:"“";
  position:absolute;
  right:20px;
  top:-30px;
  font-size:150px;
  color:rgba(229,184,92,.15);
  font-family:Georgia,serif;
}

.message h4{
  color:var(--gold);
  font-family:Georgia,serif;
  font-size:25px;
  margin-bottom:12px;
}

.message p{
  color:rgba(255,255,255,.75);
}


/* =====================================================
   CLASSES
===================================================== */

.classes{
  background:#fff;
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.class-card{
  padding:32px;
  border:1px solid var(--line);
  border-radius:25px;
  background:#fff;
  box-shadow:0 15px 40px rgba(7,25,54,.06);
  transition:.3s;
}

.class-card:hover{
  transform:translateY(-7px);
  box-shadow:var(--shadow);
}

.class-number{
  width:55px;
  height:55px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:var(--cream);
  color:#a77b20;
  font-weight:800;
  margin-bottom:20px;
}

.class-card h3{
  color:var(--navy);
  font-family:Georgia,serif;
  font-size:25px;
  margin-bottom:9px;
}

.class-card p{
  color:var(--muted);
  font-size:14px;
}


/* =====================================================
   FEES
===================================================== */

.fees{
  background:var(--soft);
}

.fee-box{
  background:#fff;
  border-radius:28px;
  padding:30px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.session{
  display:inline-block;
  background:var(--navy);
  color:var(--gold2);
  padding:9px 16px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:17px;
  text-align:left;
  border-bottom:1px solid var(--line);
}

th{
  background:var(--navy);
  color:#fff;
}

td{
  color:#4d5667;
}

.fee-note{
  padding-top:20px;
  color:var(--muted);
  font-size:13px;
}


/* =====================================================
   NOTICE
===================================================== */

.notice{
  background:var(--cream);
}

.notice-box{
  max-width:900px;
  margin:auto;
  border:1px solid var(--line);
  border-radius:25px;
  overflow:hidden;
  background:#fff;
  box-shadow:var(--shadow);
}

.notice-head{
  background:var(--navy);
  color:#fff;
  padding:20px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.notice-head strong{
  font-family:Georgia,serif;
  font-size:23px;
}

.update{
  background:var(--gold);
  color:var(--navy);
  padding:6px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.notice-body{
  padding:25px;
}

.notice-item{
  padding:18px 0;
  border-bottom:1px solid var(--line);
}

.notice-item:last-child{
  border-bottom:0;
}

.notice-item strong{
  color:var(--navy);
}


/* =====================================================
   GALLERY
===================================================== */

.gallery{
  background:#fff;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.gallery-grid img{
  width:100%;
  height:270px;
  object-fit:cover;
  border-radius:20px;
  display:block;
  transition:.35s;
}

.gallery-grid img:hover{
  transform:scale(1.025);
}


/* =====================================================
   ADMISSION
===================================================== */

.admission{
  background:var(--navy);
  color:#fff;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.admission::before{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border:1px solid rgba(229,184,92,.2);
  border-radius:50%;
  left:-180px;
  top:-180px;
}

.admission h2{
  font-family:Georgia,serif;
  font-size:48px;
  margin-bottom:15px;
}

.admission p{
  color:rgba(255,255,255,.72);
  max-width:650px;
  margin:0 auto 28px;
}


/* =====================================================
   DOCUMENTS
===================================================== */

.documents{
  background:var(--cream);
}

.document-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.document-card{
  padding:21px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:0 8px 25px rgba(7,25,54,.05);
  color:var(--text);
  font-weight:600;
}

.document-card small{
  display:block;
  color:var(--muted);
  font-weight:400;
  margin-top:4px;
}


/* =====================================================
   CONTACT
===================================================== */

.contact{
  background:#fff;
}

.contact-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.contact-card{
  padding:30px;
  border:1px solid var(--line);
  border-radius:22px;
  text-align:center;
}

.contact-card strong{
  display:block;
  color:var(--navy);
  font-family:Georgia,serif;
  font-size:21px;
  margin-bottom:7px;
}

.contact-card span{
  color:var(--muted);
  font-size:14px;
}

.map-btn{
  display:inline-block;
  background:var(--navy);
  color:#fff;
  padding:10px 16px;
  border-radius:25px;
  font-size:13px;
  font-weight:700;
}

.map-btn:hover{
  background:var(--blue);
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  background:#041126;
  color:#fff;
  padding:45px 5% 25px;
}

.footer-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:center;
}

.footer-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.footer-brand img{
  width:55px;
  height:55px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:4px;
}

.footer-brand strong{
  display:block;
}

.footer-brand small{
  color:rgba(255,255,255,.55);
}

.footer-tag{
  color:var(--gold);
  letter-spacing:3px;
  font-size:12px;
}

.copyright{
  text-align:center;
  border-top:1px solid rgba(255,255,255,.1);
  margin-top:30px;
  padding-top:20px;
  color:rgba(255,255,255,.45);
  font-size:12px;
}


/* =====================================================
   WHATSAPP
===================================================== */

.whatsapp{
  position:fixed;
  right:22px;
  bottom:22px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25D366;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:27px;
  z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1100px){

  .desktop-nav{
    gap:15px;
  }

  .desktop-nav a{
    font-size:11px;
  }

  .hero h1{
    font-size:60px;
  }

}


/* =====================================================
   MOBILE / TABLET
===================================================== */

@media(max-width:900px){

  .desktop-nav{
    display:none;
  }

  .menu-btn{
    display:grid;
  }

  .hero{
    min-height:700px;
    background-position:center center;
  }

  .hero-inner{
    min-height:700px;
    padding:70px 6% 80px;
    align-items:center;
  }

  .hero-content{
    max-width:100%;
  }

  .hero h1{
    font-size:clamp(45px,10vw,68px);
  }

  .hero-sub{
    max-width:620px;
  }

  .hero-features{
    margin-top:45px;
  }

  .stats{
    margin:25px 5% 0;
  }

  .about-grid{
    grid-template-columns:1fr;
  }

  .class-grid{
    grid-template-columns:1fr;
  }

  .contact-grid{
    grid-template-columns:1fr;
  }

  .document-grid{
    grid-template-columns:1fr 1fr;
  }

  .footer-inner{
    flex-direction:column;
    text-align:center;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:650px){

  .topbar{
    justify-content:center;
    text-align:center;
    padding:8px 4%;
    font-size:11px;
  }

  .topbar span:last-child{
    display:none;
  }

  .nav-inner{
    padding:10px 5%;
  }

  .brand img{
    width:46px;
    height:46px;
  }

  .brand-text strong{
    font-size:15px;
  }

  .brand-text small{
    font-size:9px;
  }

  .menu-btn{
    width:45px;
    height:45px;
  }

  .menu-panel{
    right:4%;
    left:4%;
    width:auto;
  }

  .hero{
    min-height:680px;

    background-image:
      linear-gradient(
        rgba(4,17,38,.66),
        rgba(4,17,38,.66)
      ),
      url("4794420C-2C8C-4713-BF55-E23285559A30.jpeg");

    background-position:center center;
    background-size:cover;
  }

  .hero-inner{
    min-height:680px;
    padding:55px 6% 70px;
    text-align:center;
  }

  .hero-content{
    width:100%;
  }

  .hero-tag{
    justify-content:center;
    font-size:11px;
    letter-spacing:1.5px;
  }

  .hero-tag::before,
  .hero-tag::after{
    width:25px;
  }

  .hero h1{
    font-size:44px;
    line-height:1.05;
    letter-spacing:-1px;
  }
