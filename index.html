<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.D Memorial School | Aurangabad, Bulandshahr</title>

<meta name="description" content="M.D Memorial School, Aurangabad, Bulandshahr — Nursery to Class 5.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --navy:#071426;
  --navy2:#0c1f39;
  --blue:#12345c;
  --gold:#c9a45c;
  --gold2:#e4c982;
  --cream:#f8f5ed;
  --white:#ffffff;
  --text:#182333;
  --muted:#687386;
  --border:rgba(201,164,92,.28);
  --shadow:0 25px 70px rgba(5,18,35,.13);
  --radius:24px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"DM Sans",sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.7;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* ================= TOP BAR ================= */

.topbar{
  background:var(--navy);
  color:#fff;
  padding:9px 0;
  font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.topbar span{
  color:#dfe5ed;
}

.topbar a{
  color:var(--gold2);
  font-weight:700;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(7,20,38,.08);
}

.navbar{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.brand-text{
  line-height:1.1;
}

.brand-text strong{
  display:block;
  font-family:"Playfair Display",serif;
  font-size:21px;
  color:var(--navy);
}

.brand-text small{
  display:block;
  color:var(--gold);
  font-size:10px;
  letter-spacing:2px;
  margin-top:5px;
  font-weight:700;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:30px;
}

.nav-links a{
  font-size:14px;
  font-weight:600;
  color:#344054;
  transition:.3s;
}

.nav-links a:hover{
  color:var(--gold);
}

.nav-admission{
  padding:11px 20px;
  border-radius:50px;
  background:var(--navy);
  color:#fff!important;
  border:1px solid var(--gold);
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  font-size:28px;
  color:var(--navy);
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  min-height:720px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 20%,rgba(201,164,92,.18),transparent 28%),
    radial-gradient(circle at 15% 80%,rgba(34,86,140,.28),transparent 30%),
    linear-gradient(135deg,#061323,#0b203b 60%,#102d50);
  color:#fff;
  display:flex;
  align-items:center;
}

.hero:before{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  border:1px solid rgba(201,164,92,.18);
  border-radius:50%;
  right:-170px;
  top:-160px;
}

.hero:after{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  border:1px solid rgba(201,164,92,.13);
  border-radius:50%;
  left:-150px;
  bottom:-170px;
}

.hero-grid{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:70px;
}

.hero-content{
  animation:fadeUp .9s ease both;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--gold2);
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:20px;
}

.eyebrow:before{
  content:"";
  width:38px;
  height:1px;
  background:var(--gold);
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(45px,6vw,76px);
  line-height:1.03;
  font-weight:600;
  max-width:720px;
}

.hero h1 span{
  color:var(--gold2);
}

.hero-sub{
  max-width:600px;
  color:#cbd5e1;
  font-size:17px;
  margin:24px 0 34px;
}

.hero-buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 25px;
  border-radius:50px;
  font-weight:700;
  font-size:14px;
  transition:.3s;
}

.btn-gold{
  background:linear-gradient(135deg,#b99047,#e5ca86);
  color:#071426;
  box-shadow:0 12px 35px rgba(201,164,92,.25);
}

.btn-gold:hover{
  transform:translateY(-3px);
}

.btn-outline{
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
}

.btn-outline:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

/* HERO LOGO */

.hero-visual{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  animation:fadeIn 1.2s ease both;
}

.logo-orbit{
  width:390px;
  height:390px;
  border-radius:50%;
  border:1px solid rgba(201,164,92,.38);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.logo-orbit:before,
.logo-orbit:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
}

.logo-orbit:before{
  inset:28px;
}

.logo-orbit:after{
  inset:60px;
}

.hero-logo-card{
  width:230px;
  height:270px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px);
  border-radius:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 35px 80px rgba(0,0,0,.25);
  position:relative;
  z-index:2;
}

.hero-logo-card img{
  width:145px;
  height:145px;
  object-fit:contain;
  margin-bottom:16px;
}

.hero-logo-card small{
  color:var(--gold2);
  letter-spacing:2px;
  font-size:10px;
  font-weight:700;
}

/* ================= STATS ================= */

.stats-wrap{
  position:relative;
  margin-top:-58px;
  z-index:5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border:1px solid rgba(7,20,38,.08);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.stat{
  padding:30px 20px;
  text-align:center;
  position:relative;
}

.stat:not(:last-child):after{
  content:"";
  position:absolute;
  right:0;
  top:28px;
  height:55px;
  width:1px;
  background:#e8e8e8;
}

.stat strong{
  display:block;
  font-family:"Playfair Display",serif;
  color:var(--navy);
  font-size:29px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}

/* ================= SECTIONS ================= */

section{
  padding:105px 0;
}

.section-head{
  text-align:center;
  max-width:720px;
  margin:0 auto 55px;
}

.section-kicker{
  color:var(--gold);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:3px;
  font-weight:800;
  margin-bottom:10px;
}

.section-head h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(34px,4vw,50px);
  line-height:1.15;
  color:var(--navy);
}

.section-head p{
  color:var(--muted);
  margin-top:15px;
}

/* ================= ABOUT ================= */

.about{
  background:var(--cream);
}

.about-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
}

.about-card{
  position:relative;
  min-height:460px;
  background:linear-gradient(145deg,#0a1b31,#12345c);
  border-radius:30px;
  overflow:hidden;
  box-shadow:var(--shadow);
  padding:45px;
  display:flex;
  align-items:flex-end;
}

.about-card:before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border:1px solid rgba(201,164,92,.25);
  border-radius:50%;
  top:-120px;
  right:-100px;
}

.about-card-inner{
  position:relative;
  z-index:2;
}

.about-card .year{
  font-family:"Playfair Display",serif;
  font-size:100px;
  color:rgba(255,255,255,.08);
  line-height:1;
}

.about-card h3{
  color:#fff;
  font-family:"Playfair Display",serif;
  font-size:32px;
}

.about-card p{
  color:#bdc8d7;
  margin-top:10px;
}

.about-text h3{
  font-family:"Playfair Display",serif;
  font-size:38px;
  color:var(--navy);
  margin-bottom:20px;
}

.about-text p{
  color:var(--muted);
  margin-bottom:18px;
}

.gold-line{
  width:70px;
  height:3px;
  background:linear-gradient(90deg,var(--gold),transparent);
  margin:25px 0;
}

/* ================= PRINCIPAL ================= */

.principal{
  background:#fff;
}

.principal-box{
  background:linear-gradient(135deg,#071426,#102c4e);
  color:#fff;
  border-radius:30px;
  padding:55px;
  position:relative;
  overflow:hidden;
}

.principal-box:after{
  content:"“";
  position:absolute;
  right:45px;
  top:-35px;
  font-family:Georgia,serif;
  font-size:230px;
  color:rgba(201,164,92,.12);
}

.principal-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.principal-label{
  color:var(--gold2);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:11px;
  font-weight:800;
}

.principal-box h3{
  font-family:"Playfair Display",serif;
  font-size:38px;
  margin:10px 0 18px;
}

.principal-box p{
  color:#c8d2df;
}

.signature{
  margin-top:25px;
  color:var(--gold2);
  font-family:"Playfair Display",serif;
  font-size:20px;
}

/* ================= CLASSES ================= */

.classes{
  background:#f7f8fa;
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.class-card{
  background:#fff;
  border:1px solid #e7e9ed;
  border-radius:24px;
  padding:32px;
  position:relative;
  overflow:hidden;
  transition:.35s;
}

.class-card:hover{
  transform:translateY(-8px);
  border-color:var(--border);
  box-shadow:0 20px 50px rgba(8,25,45,.1);
}

.class-number{
  position:absolute;
  right:20px;
  top:8px;
  font-family:"Playfair Display",serif;
  font-size:75px;
  color:#f0f1f3;
  font-weight:700;
}

.class-card h3{
  position:relative;
  z-index:2;
  font-family:"Playfair Display",serif;
  font-size:27px;
  color:var(--navy);
  margin-top:35px;
}

.class-card p{
  color:var(--muted);
  font-size:14px;
  margin-top:7px;
}

.card-line{
  width:40px;
  height:2px;
  background:var(--gold);
  margin-top:22px;
}

/* ================= FEES ================= */

.fees{
  background:var(--navy);
  color:#fff;
}

.fees .section-head h2{
  color:#fff;
}

.fees .section-head p{
  color:#aebaca;
}

.fee-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
}

.fee-card{
  border:1px solid rgba(201,164,92,.3);
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border-radius:26px;
  padding:35px;
  backdrop-filter:blur(10px);
}

.fee-card h3{
  font-family:"Playfair Display",serif;
  color:var(--gold2);
  font-size:28px;
}

.fee-price{
  margin:20px 0;
  font-size:34px;
  font-weight:700;
}

.fee-price span{
  font-size:13px;
  font-weight:400;
  color:#aebaca;
}

.fee-info{
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,.12);
  color:#c4cedb;
  font-size:14px;
}

/* ================= NOTICE ================= */

.notice{
  background:var(--cream);
}

.notice-box{
  max-width:850px;
  margin:auto;
  background:#fff;
  border-radius:25px;
  padding:35px;
  box-shadow:var(--shadow);
}

.notice-item{
  display:flex;
  gap:20px;
  padding:22px 0;
  border-bottom:1px solid #eceef1;
}

.notice-item:last-child{
  border-bottom:0;
}

.notice-icon{
  min-width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(201,164,92,.12);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.notice-item h3{
  color:var(--navy);
  font-size:17px;
}

.notice-item p{
  color:var(--muted);
  font-size:14px;
  margin-top:3px;
}

/* ================= GALLERY ================= */

.gallery{
  background:#fff;
}

.gallery-grid{
  columns:3 250px;
  column-gap:18px;
}

.gallery-item{
  break-inside:avoid;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:#eee;
}

.gallery-item img{
  width:100%;
  transition:.5s;
}

.gallery-item:hover img{
  transform:scale(1.06);
}

.gallery-item:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 55%,rgba(0,0,0,.3));
  pointer-events:none;
}

/* ================= ADMISSION ================= */

.admission{
  background:
    radial-gradient(circle at 10% 20%,rgba(201,164,92,.15),transparent 25%),
    linear-gradient(135deg,#071426,#102b4c);
  color:#fff;
}

.admission-box{
  text-align:center;
  max-width:800px;
  margin:auto;
}

.admission-box .section-kicker{
  color:var(--gold2);
}

.admission-box h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(36px,5vw,58px);
}

.admission-box p{
  color:#c2ccda;
  margin:18px auto 30px;
  max-width:650px;
}

.admission-buttons{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

/* ================= DOCUMENTS ================= */

.documents{
  background:#f7f8fa;
}

.document-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.document{
  padding:22px;
  background:#fff;
  border-radius:18px;
  border:1px solid #e8eaed;
  display:flex;
  align-items:center;
  gap:13px;
  transition:.3s;
}

.document:hover{
  transform:translateY(-4px);
  border-color:var(--border);
}

.document-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:rgba(201,164,92,.13);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.document span{
  font-size:13px;
  font-weight:600;
  color:#3a4554;
}

/* ================= CONTACT ================= */

.contact{
  background:#fff;
}

.contact-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.contact-card{
  border:1px solid #e7e9ed;
  border-radius:23px;
  padding:32px;
  text-align:center;
  transition:.3s;
}

.contact-card:hover{
  box-shadow:0 20px 45px rgba(8,25,45,.08);
  transform:translateY(-5px);
}

.contact-icon{
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(201,164,92,.12);
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 17px;
  font-size:20px;
}

.contact-card h3{
  font-family:"Playfair Display",serif;
  font-size:22px;
  color:var(--navy);
}

.contact-card p{
  color:var(--muted);
  font-size:14px;
  margin-top:7px;
}

/* ================= FOOTER ================= */

footer{
  background:#050f1d;
  color:#fff;
  padding:55px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:50px;
  padding-bottom:40px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.footer-brand{
  display:flex;
  gap:14px;
  align-items:center;
  margin-bottom:18px;
}

.footer-brand img{
  width:60px;
  height:60px;
  object-fit:contain;
}

.footer-brand strong{
  font-family:"Playfair Display",serif;
  font-size:22px;
}

footer p{
  color:#8e9bad;
  font-size:13px;
}

.footer-title{
  color:var(--gold2);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:17px;
  font-weight:800;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.footer-links a{
  color:#b5bfcc;
  font-size:13px;
  transition:.3s;
}

.footer-links a:hover{
  color:var(--gold2);
}

.copyright{
  text-align:center;
  color:#687587;
  font-size:12px;
  padding-top:23px;
}

/* ================= FLOATING BUTTONS ================= */

.float-buttons{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.float-btn{
  width:53px;
  height:53px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  transition:.3s;
}

.float-btn:hover{
  transform:scale(1.1);
}

.call-btn{
  background:var(--navy);
  border:1px solid var(--gold);
}

.whatsapp-btn{
  background:#168c4b;
}

/* ================= ANIMATION ================= */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scale(.92);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.reveal{
  animation:fadeUp .8s ease both;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .nav-links{
    position:absolute;
    top:82px;
    left:0;
    right:0;
    background:#fff;
    padding:20px 5%;
    display:none;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    box-shadow:0 20px 30px rgba(0,0,0,.08);
  }

  .nav-links.active{
    display:flex;
  }

  .nav-links a{
    padding:14px 0;
    border-bottom:1px solid #eee;
  }

  .nav-admission{
    text-align:center;
    margin-top:12px;
  }

  .menu-btn{
    display:block;
  }

  .hero{
    min-height:auto;
    padding:90px 0 120px;
  }

  .hero-grid{
    grid-template-columns:1fr;
    gap:55px;
    text-align:center;
  }

  .hero-sub{
    margin-left:auto;
    margin-right:auto;
  }

  .hero-buttons{
    justify-content:center;
  }

  .hero-visual{
    order:-1;
  }

  .logo-orbit{
    width:300px;
    height:300px;
  }

  .hero-logo-card{
    width:190px;
    height:225px;
  }

  .hero-logo-card img{
    width:115px;
    height:115px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stat:nth-child(2):after{
    display:none;
  }

  .about-grid{
    grid-template-columns:1fr;
  }

  .class-grid{
    grid-template-columns:repeat(2,1fr);
  }
